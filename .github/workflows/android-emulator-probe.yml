name: Android ARM64 emulator capability probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator system-images;android-${{ matrix.api }};google_apis;arm64-v8a
      - run: python scripts/android_arm_emulator.py ${{ matrix.api }} unused unused emulator-probe --boot-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-ARM64-API-${{ matrix.api }}-boot-probe
          path: emulator-probe/*
