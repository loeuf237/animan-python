name: Android ARM64 emulator capability probe
on:
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: Existing Android build run to test, or leave empty for boot only
        default: ''
        required: false
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator system-images;android-${{ matrix.api }};google_apis;arm64-v8a
      - uses: actions/download-artifact@v4
        if: inputs.apk_run_id != ''
        with:
          name: Android-under-test
          path: android-validation
          github-token: ${{ github.token }}
          run-id: ${{ inputs.apk_run_id }}
      - name: Boot or validate the immutable APK
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          if [ -z "$APK_RUN_ID" ]; then
            python scripts/android_arm_emulator.py ${{ matrix.api }} unused unused emulator-probe --boot-only
          else
            python scripts/android_arm_emulator.py ${{ matrix.api }} android-validation/Animan-Android-under-test.apk android-validation/Animan-instrumentation.apk emulator-probe
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-ARM64-API-${{ matrix.api }}-boot-probe
          path: emulator-probe/*
