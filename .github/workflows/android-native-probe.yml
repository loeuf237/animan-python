name: Android native dependency probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native build utilities
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - name: Build missing Android wheels
        run: python scripts/android_native_wheels.py
      - uses: actions/upload-artifact@v4
        with:
          name: Android-arm64-Python313-native-wheels
          path: android/wheels/*.whl
          if-no-files-found: error
