name: Validate locally signed Android APK
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Build run containing the unchanged native media test APKs
        required: true
      draft_release_id:
        description: Draft Android release containing locally signed app and instrumentation
        required: true
permissions:
  contents: read
  actions: read
jobs:
  signed-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Android-under-test
          path: android-validation
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Download locally signed outputs without private key
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: python scripts/android_fetch_signed.py "$DRAFT_RELEASE_ID" android-validation
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            status=0
            python scripts/android_instrumentation.py android-validation/Animan-Android-under-test.apk android-validation/Animan-instrumentation.apk signed-test-results/runtime --skip-native-media || status=1
            python scripts/android_instrumentation.py android-validation/Animan-native-media-probe.apk android-validation/Animan-native-media-tests.apk signed-test-results/media --package com.animan.nativeprobe || status=1
            exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-Android-API-${{ matrix.api }}-test-results
          path: signed-test-results/**
