name: Validate locally signed Android APK
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Build run containing the unchanged native media test APKs
        required: true
      signed_run_id:
        description: Assembly run containing the verified locally signed APKs
        required: true
permissions:
  contents: read
  actions: read
jobs:
  signed-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Android-under-test
          path: android-validation
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Android-signed-under-test
          path: android-validation
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python scripts/android_run_probes.py android-validation signed-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-Android-API-${{ matrix.api }}-test-results
          path: signed-test-results/**
