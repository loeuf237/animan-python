name: Validate locally signed Android APK
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Build run containing the unchanged native media test APKs
        required: true
      signed_run_id:
        description: Assembly run containing the verified locally signed APKs
        required: true
      publish:
        type: boolean
        default: false
        description: Publish a new prerelease only after all device checks pass
      tag_name:
        required: true
        default: android-v0.1.0-beta.2
        description: New Android prerelease tag
permissions:
  contents: read
  actions: read
jobs:
  signed-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Android-under-test
          path: android-validation
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Android-signed-under-test
          path: android-validation
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Root only the disposable Google APIs emulator's ADB daemon so the
          # collector can pull app-owned evidence on Android 11. The app still
          # executes under its normal UID and production storage permissions.
          script: |
            adb root
            adb wait-for-device
            python scripts/android_run_probes.py android-validation signed-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-Android-API-${{ matrix.api }}-test-results
          path: signed-test-results/**

  publish:
    if: inputs.publish
    needs: signed-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag_name }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SIGNED_RUN_ID: ${{ inputs.signed_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: Android-signed-under-test
          path: signed-candidate
          run-id: ${{ inputs.signed_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, update signing identity and APK checksums
        run: |
          SOURCE_COMMIT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" --jq .head_sha)
          python scripts/android_publish.py signed-candidate release-assets \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" --candidate-run-id "$CANDIDATE_RUN_ID" --signed-run-id "$SIGNED_RUN_ID"
      - name: Publish tested production-signed APK without replacing old releases
        run: |
          SOURCE_COMMIT=$(python -c 'import json; print(json.load(open("release-assets/Android-build-info.json"))["commit"])')
          gh release create "$RELEASE_TAG" release-assets/* --target "$SOURCE_COMMIT" \
            --title "AnimeLab 0.1.0 Android beta 2" --prerelease \
            --notes-file docs/releases/android-v0.1.0-beta.2.md
      - uses: actions/upload-artifact@v4
        with:
          name: Android-published-release
          path: release-assets/*
          if-no-files-found: error
